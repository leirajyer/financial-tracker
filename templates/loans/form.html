{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-10">
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">New Loan Application</h1>
        <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-[0.2em] mt-2">Personal & Business Credit Tracking</p>
    </div>

    <form action="/loans/add" method="POST" class="space-y-8 bg-white p-10 rounded-2xl border border-slate-100 shadow-2xl shadow-indigo-50/50">
        <!-- Description -->
        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Loan Description</label>
            <input type="text" name="description" placeholder="Loan Description" required
                class="w-full p-5 bg-slate-50 border-none rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Amount -->
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Principal Amount (₱)</label>
                <input type="number" step="0.01" name="amount" placeholder="0.00" required
                    class="w-full p-5 bg-slate-50 border-none rounded-xl font-black text-slate-900 text-lg focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>

            <!-- Fix Rate -->
            <div>
                <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-3 ml-1">Annual Fixed Rate (%)</label>
                <input type="number" step="0.01" name="interest_rate" placeholder="0.00" required
                    class="w-full p-5 bg-indigo-50/30 border-none rounded-xl font-black text-indigo-600 text-lg focus:ring-2 focus:ring-indigo-500 transition-all">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Terms -->
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Payment Term</label>
                <select name="terms" required
                    class="w-full p-5 bg-slate-50 border-none rounded-xl font-bold text-slate-700 cursor-pointer focus:ring-2 focus:ring-indigo-500 transition-all appearance-none">
                    {% for opt in terms_options %}
                    <option value="{{ opt.value }}">{{ opt.label }}</option>
                    {% endfor %}
                    <option value="15">15 Years</option>
                    <option value="20">20 Years</option>
                    <option value="30">30 Years</option>
                </select>
            </div>

            <!-- Category -->
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Global Category</label>
                <select name="category_id" required
                    class="w-full p-5 bg-slate-50 border-none rounded-xl font-bold text-slate-700 cursor-pointer focus:ring-2 focus:ring-indigo-500 transition-all appearance-none">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Start Date -->
        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 ml-1">Loan Start Date</label>
            <input type="date" name="start_date" value="{{ today }}" required
                class="w-full p-5 bg-slate-50 border-none rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div class="pt-6">
            <button type="submit"
                class="w-full bg-slate-900 text-white p-6 rounded-2xl font-black text-sm uppercase tracking-widest shadow-2xl shadow-indigo-200 hover:bg-indigo-600 hover:-translate-y-1 transition-all duration-300">
                Register New Loan
            </button>
            <a href="/loans/" class="block text-center mt-6 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-slate-600 transition-colors">
                Cancel and Go Back
            </a>
        </div>
    </form>
</div>
{% endblock %}
