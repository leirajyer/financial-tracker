{% extends "base.html" %}

{% block content %}
<div class="w-full mx-auto space-y-6">

    <!-- Page Header with Quick Action -->
    <div class="flex items-center justify-between mb-2">
        <div class="flex flex-col gap-1">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Financial Pulse</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Homepage Dashboard</p>
        </div>
        <a href="/cashflow/add"
           class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-black uppercase tracking-widest px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-200 transition-all hover:shadow-indigo-300 hover:-translate-y-px">
            <i class="fa-solid fa-plus text-xs"></i>
            Add Expense
        </a>
    </div>



    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                <h3 class="font-black text-slate-800 uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-emerald-500"></i> Recent Activity
                </h3>
                <a href="/cashflow" class="text-[10px] text-emerald-600 font-bold uppercase hover:underline">View
                    All</a>
            </div>
            <div class="p-2">
                {% include "cashflow/summary.html" %}
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                <h3 class="font-black text-slate-800 uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-credit-card text-indigo-500"></i> Credit Pulse
                </h3>
                <div class="flex items-center gap-4">
                    <a href="/installments" class="text-[10px] text-indigo-600 font-bold uppercase hover:underline">Manage</a>
                </div>
            </div>
            <div class="p-2">
                {% include "installments/summary.html" %}
            </div>
        </div>

    </div>
</div>
{% endblock %}
