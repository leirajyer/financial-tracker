{% extends "base.html" %}

{% block content %}
<div class="w-full max-w-3xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-black text-slate-800 tracking-tight">Add Transaction</h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Cashflow Ledger</p>
    </div>

    <form action="/cashflow/add" method="POST" class="space-y-6">
        <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm space-y-6">
            <div class="w-full">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₱</span>
                    <input type="number" step="0.01" name="amount" required placeholder="0.00"
                        class="w-full pl-8 pr-4 py-4 bg-slate-50 border-none rounded-xl text-2xl font-black focus:ring-2 focus:ring-emerald-500 transition-all">
                </div>
            </div>

            <div class="w-full">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Transaction Type</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 p-1.5 bg-slate-100 rounded-xl">
                    <label class="relative cursor-pointer">
                        <input type="radio" name="type" value="income" class="peer sr-only" checked>
                        <div class="py-3 text-center rounded-xl font-bold text-xs transition-all
                    text-slate-500 peer-checked:bg-white peer-checked:text-emerald-500 peer-checked:shadow-sm">
                            💰 Income
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="type" value="expense" class="peer sr-only">
                        <div class="py-3 text-center rounded-xl font-bold text-xs transition-all
                    text-slate-500 peer-checked:bg-white peer-checked:text-rose-500 peer-checked:shadow-sm">
                            💸 Cash Expense
                        </div>
                    </label>
                    <label class="relative cursor-pointer">
                        <input type="radio" name="type" value="credit_expense" class="peer sr-only">
                        <div class="py-3 text-center rounded-xl font-bold text-xs transition-all
                    text-slate-500 peer-checked:bg-white peer-checked:text-indigo-500 peer-checked:shadow-sm">
                            💳 Card Swipe
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-3">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Category</label>
                    <a href="/settings/#categories" class="text-[10px] font-black text-indigo-500 hover:text-indigo-700 uppercase tracking-widest transition-colors">+ Add</a>
                </div>
                <div class="flex flex-wrap gap-2">
                    {% for cat in categories %}
                    <label class="cursor-pointer">
                        <input type="radio" name="category_id" value="{{ cat.id }}" class="peer sr-only category-radio"
                            data-is-cc="{% if cat.name == 'Credit Card' %}true{% else %}false{% endif %}"
                            hx-get="/cashflow/get-installments-by-category/{{ cat.id }}"
                            hx-target="#card-selector-container"
                            hx-swap="innerHTML">
                        <div class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 transition-all
                            peer-checked:text-white peer-checked:border-transparent"
                            style="--cat-color: {{ cat.color }}">
                            {{ cat.name }}
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Dynamic Card Selector Area (For paying OFF a credit card) -->
            <div id="card-selector-container" class="space-y-4"></div>

            <!-- Optional Card Selector Area (For Expense SWIPES) -->
            <div id="expense-card-container" class="hidden">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Paid via Card (Optional)</label>
                <div class="relative">
                    <select name="expense_card_id" id="expense_card_select" class="w-full p-4 bg-slate-50 border-none rounded-xl font-bold focus:ring-2 focus:ring-emerald-500 text-slate-700 appearance-none">
                        <option value="">-- Cash / Other --</option>
                        {% for card in cards %}
                        <option value="{{ card.id }}">{{ card.name }}</option>
                        {% endfor %}
                    </select>
                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Description</label>
                <input type="text" name="description" id="transaction-description" placeholder="What was this for?" required
                    class="w-full p-4 bg-slate-50 border-none rounded-xl font-medium focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Date</label>
                <input type="date" name="date" id="transaction-date" value="{{ today }}"
                    class="w-full p-4 bg-slate-50 border-none rounded-xl font-bold focus:ring-2 focus:ring-emerald-500">
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-3">
            <button type="submit"
                class="flex-1 bg-slate-900 text-white p-5 rounded-xl font-black text-sm tracking-widest hover:bg-emerald-600 transition-all shadow-xl shadow-slate-200 uppercase">
                Save Transaction
            </button>

            <a href="/"
                class="flex-1 bg-slate-100 text-slate-500 p-5 rounded-xl font-black text-sm tracking-widest hover:bg-slate-200 transition-all text-center uppercase">
                Cancel
            </a>
        </div>
    </form>
</div>

<style>
    input[name="category_id"]:checked+div[style*="--cat-color"] {
        background-color: var(--cat-color);
        box-shadow: 0 4px 12px -2px var(--cat-color);
    }
</style>

<script>
    // Listen for changes in the card selector container to update the amount
    document.addEventListener('change', function(e) {
        if (e.target && e.target.name === 'card_id') {
            const selectedCardLabel = e.target.closest('label');
            const amountText = selectedCardLabel.querySelector('.text-rose-500').innerText;
            const amount = parseFloat(amountText.replace('₱', '').replace(/,/g, ''));
            
            const amountInput = document.querySelector('input[name="amount"]');
            if (amountInput) {
                amountInput.value = amount;
            }

            const descriptionInput = document.getElementById('transaction-description');
            if (descriptionInput && !descriptionInput.value) {
                const cardName = selectedCardLabel.querySelector('.text-xs').innerText;
                descriptionInput.value = `Credit Card Payment - ${cardName}`;
            }
        }
    });

    function updateExpenseCardVisibility() {
        const typeIncome = document.querySelector('input[name="type"][value="income"]').checked;
        const typeCredit = document.querySelector('input[name="type"][value="credit_expense"]').checked;
        const selectedCat = document.querySelector('input[name="category_id"]:checked');
        const isCcCategory = selectedCat ? selectedCat.getAttribute('data-is-cc') === 'true' : false;
        
        const expenseCardContainer = document.getElementById('expense-card-container');
        
        // Show only if "Card Swipe" is explicitly selected
        // OR if it's a regular expense and we previously allowed optional selection.
        // User wants "if paid by credit then show the banks"
        if (typeCredit) {
            expenseCardContainer.classList.remove('hidden');
        } else {
            expenseCardContainer.classList.add('hidden');
            document.getElementById('expense_card_select').value = ""; // Clear selection
        }
    }

    // Listen to changes on category
    document.addEventListener('change', function(e) {
        if (e.target && e.target.name === 'category_id') {
            updateExpenseCardVisibility();
        }
    });

    // Reset container if type is changed to income
    document.querySelectorAll('input[name="type"]').forEach(radio => {
        radio.addEventListener('change', function() {
            updateExpenseCardVisibility();
            if (this.value === 'income') {
                document.getElementById('card-selector-container').innerHTML = '';
            }
        });
    });

    // Reset fields when the card selector is emptied (switched to non-credit-card category)
    document.getElementById('card-selector-container').addEventListener('htmx:afterSwap', function(e) {
        if (this.innerHTML.trim() === '') {
            // No longer clearing amount/description on category change as per user request
        }
    });
    
    // Initial call
    updateExpenseCardVisibility();
</script>
{% endblock %}
